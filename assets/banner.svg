<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Emmanuel Omowumi - Senior Data Analyst. SQL, Python, Power BI and data engineering. Nigeria.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="0.55" stop-color="#0d3b66"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7fb2ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1090" cy="-20" r="210" fill="#5eead4" fill-opacity="0.07"/>
    <circle cx="640" cy="360" r="190" fill="#7fb2ff" fill-opacity="0.07"/>
  </g>

  <!-- left: identity -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="104" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">Emmanuel Omowumi</text>
    <rect x="64" y="124" width="64" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="166" font-size="26" font-weight="600" fill="#5eead4" letter-spacing="4">SENIOR DATA ANALYST</text>
    <text x="64" y="200" font-size="17" fill="#d6e4f5">Turning messy data into decisions: SQL, Python, Power BI and reliable pipelines</text>

    <g font-size="14" font-weight="600" fill="#ffffff">
      <rect x="64" y="228" width="58" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="93" y="248" text-anchor="middle">SQL</text>
      <rect x="132" y="228" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="172" y="248" text-anchor="middle">Python</text>
      <rect x="222" y="228" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="271" y="248" text-anchor="middle">Power BI</text>
      <rect x="330" y="228" width="58" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="359" y="248" text-anchor="middle">dbt</text>
      <rect x="398" y="228" width="86" height="30" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="441" y="248" text-anchor="middle">Airflow</text>
    </g>
    <text x="64" y="292" font-size="14" fill="#9fb8d3" letter-spacing="1">NIGERIA  ·  FINTECH  ·  FMCG  ·  ANALYTICS ENGINEERING</text>
  </g>

  <!-- right: dashboard motif -->
  <g transform="translate(700,40)" filter="url(#shadow)">
    <rect width="440" height="240" rx="16" fill="#0a2748" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.18"/>
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <circle cx="24" cy="24" r="5" fill="#f87171"/><circle cx="42" cy="24" r="5" fill="#fbbf24"/><circle cx="60" cy="24" r="5" fill="#34d399"/>
      <text x="416" y="29" font-size="12" fill="#9fb8d3" text-anchor="end">analytics dashboard</text>

      <!-- KPI cards -->
      <rect x="24" y="48" width="118" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <text x="38" y="70" font-size="9.5" fill="#9fb8d3" letter-spacing="0.3">RECORDS PROCESSED</text>
      <text x="38" y="96" font-size="22" font-weight="700" fill="#ffffff">117,891</text>
      <rect x="161" y="48" width="118" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <text x="175" y="70" font-size="9.5" fill="#9fb8d3" letter-spacing="0.3">REVIEWS ANALYSED</text>
      <text x="175" y="96" font-size="22" font-weight="700" fill="#5eead4">34K</text>
      <rect x="298" y="48" width="118" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <text x="312" y="70" font-size="9.5" fill="#9fb8d3" letter-spacing="0.3">DATA TESTS PASSING</text>
      <text x="312" y="96" font-size="22" font-weight="700" fill="#ffffff">20/20</text>
    </g>

    <!-- area + line chart -->
    <path d="M24 214 L24 176 L72 168 L120 182 L168 150 L216 158 L264 128 L312 136 L360 108 L416 118 L416 214 Z" fill="url(#area)"/>
    <path d="M24 176 L72 168 L120 182 L168 150 L216 158 L264 128 L312 136 L360 108 L416 118" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#071a33" stroke="#5eead4" stroke-width="2.5">
      <circle cx="168" cy="150" r="4.5"/><circle cx="264" cy="128" r="4.5"/><circle cx="360" cy="108" r="4.5"/><circle cx="416" cy="118" r="4.5"/>
    </g>
    <path d="M24 214H416" stroke="#ffffff" stroke-opacity="0.2"/>
  </g>
</svg>
